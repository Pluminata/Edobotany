      <div class="form-row"><label>菜品名</label><div class="search-combo" id="advCombo_dish"><input placeholder="菜品名" autocomplete="off" oninput="filterAdvCombo('dish', this.value)" onfocus="filterAdvCombo('dish', this.value)"><div class="dropdown-list"></div></div></div>
      <div class="form-row"><label>菜品详细做法</label><div class="search-combo" id="advCombo_method"><input placeholder="做法关键词" autocomplete="off" oninput="filterAdvCombo('method', this.value)" onfocus="filterAdvCombo('method', this.value)"><div class="dropdown-list"></div></div></div>
      <div class="form-row"><label>参考文献</label><input placeholder="文献关键词" oninput="currentAdvSearch.refs = this.value"></div>
    </div>
    <div class="form-actions"><button onclick="closeModal()">取消</button><button onclick="clearAdvSearch()">清空</button><button class="primary" onclick="runAdvSearch()">搜索</button></div>
  `, 'lg');
  renderTagCombo('advPartPicker', () => currentAdvSearch.parts, (arr) => { currentAdvSearch.parts = arr; }, 'partsLib', '部位 输入后回车…', '');
  renderTagCombo('advWayPicker', () => currentAdvSearch.ways, (arr) => { currentAdvSearch.ways = arr; }, 'waysLib', '如：炖汤、煸炒等', 'way-tag');
}

function clearAdvSearch() {
  currentAdvSearch = { chineseLatin:'', family:'', genus:'', province:'', city:'', county:'', town:'', ethnic:'', langPath:'', commonName:'', parts:[], ways:[], dish:'', method:'', refs:'' };
  document.querySelectorAll('#modalBody .search-combo input').forEach(i => i.value = '');
  renderTagCombo('advPartPicker', () => currentAdvSearch.parts, (arr) => { currentAdvSearch.parts = arr; }, 'partsLib', '部位 输入后回车…', '');
  renderTagCombo('advWayPicker', () => currentAdvSearch.ways, (arr) => { currentAdvSearch.ways = arr; }, 'waysLib', '如：炖汤、煸炒等', 'way-tag');
}

function filterAdvCombo(field, q) {
  const wrap = document.getElementById('advCombo_' + field);
  if (!wrap) return;
  const input = wrap.querySelector('input');
  const dropdown = wrap.querySelector('.dropdown-list');
  let opts = [];
  const lower = q.toLowerCase();
  if (field === 'chineseLatin') {
    nodes.filter(n => n.type === 'species').forEach(n => {
      if (n.chinese) opts.push({ value: n.chinese, label: n.chinese, latin: n.latin || '' });
      if (n.latin) opts.push({ value: n.latin, label: n.latin, latin: n.chinese || '' });
    });
  } else if (field === 'family') {
    const seen = new Set();
    nodes.forEach(n => { if (n.type === 'rank' && n.rankName === '科' && n.cn && !seen.has(n.cn)) { opts.push({ value: n.cn }); seen.add(n.cn); } });
  } else if (field === 'genus') {
    const seen = new Set();
    nodes.forEach(n => { if (n.type === 'rank' && n.rankName === '属' && n.cn && !seen.has(n.cn)) { opts.push({ value: n.cn }); seen.add(n.cn); } });
  } else if (field === 'province' || field === 'city' || field === 'county' || field === 'town') {
    const seen = new Set();
    collectAllRecords().forEach(({rec}) => {
      const norm = normalizeRecord(rec);
      (norm.regions || []).forEach(r => { const v = r[field]; if (v && !seen.has(v)) { opts.push({value:v}); seen.add(v); } });
    });
  } else if (field === 'ethnic') {
    const seen = new Set();
    collectAllRecords().forEach(({rec}) => { if (rec.ethnic && !seen.has(rec.ethnic)) { opts.push({value:rec.ethnic}); seen.add(rec.ethnic); } });
  } else if (field === 'langPath') {
    const seen = new Set();
    collectAllRecords().forEach(({rec}) => {
      const norm = normalizeRecord(rec);
      (norm.langPaths || []).forEach(lp => { if (lp && !seen.has(lp)) { opts.push({value:lp}); seen.add(lp); } });
    });
  } else if (field === 'commonName') {
    const seen = new Set();
    collectAllRecords().forEach(({rec}) => {
      const norm = normalizeRecord(rec);
      (norm.names || []).forEach(nm => { if (nm.text && !seen.has(nm.text)) { opts.push({value:nm.text}); seen.add(nm.text); } });
    });
  } else if (field === 'dish') {
    const seen = new Set();
    collectAllRecords().forEach(({rec}) => (rec.usages||[]).forEach(u => (u.ways||[]).forEach(w => { if (w.dish && !seen.has(w.dish)) { opts.push({value:w.dish}); seen.add(w.dish); } })));
  } else if (field === 'method') {
    const seen = new Set();
    collectAllRecords().forEach(({rec}) => (rec.usages||[]).forEach(u => (u.ways||[]).forEach(w => { if (w.method && !seen.has(w.method)) { opts.push({value:w.method}); seen.add(w.method); } })));
  }
  const filtered = lower ? opts.filter(o => o.value.toLowerCase().includes(lower)) : opts;
  if (!filtered.length) { dropdown.classList.remove('open'); return; }
  dropdown.innerHTML = filtered.slice(0, 80).map((o, i) => `<div class="opt ${i===0?'hl':''}" data-i="${i}"><span>${escapeHtml(o.value)}</span>${o.latin ? `<span class="opt-latin">${escapeHtml(o.latin)}</span>` : ''}</div>`).join('');
  dropdown.classList.add('open');
  const first = dropdown.querySelector('.opt');
  if (first) first.scrollIntoView({ block: 'nearest' });
  dropdown.querySelectorAll('.opt').forEach(n => {
    n.addEventListener('mousedown', e => {
      e.preventDefault();
      const o = filtered[+n.dataset.i];
      input.value = o.value;
      currentAdvSearch[field] = o.value;
      dropdown.classList.remove('open');
    });
  });
}


function runAdvSearch() {
  const q = currentAdvSearch;
  const results = [];
  nodes.filter(n => n.type === 'species').forEach(n => {
    if (q.chineseLatin) {
      const cl = q.chineseLatin.toLowerCase();
      if (!((n.chinese || '').toLowerCase().includes(cl) || (n.latin || '').toLowerCase().includes(cl))) return;
    }
    if (q.family && !pathHasRank(n.id, '科', q.family)) return;
    if (q.genus && !pathHasRank(n.id, '属', q.genus)) return;
    if (q.refs && !(n.refs || '').toLowerCase().includes(q.refs.toLowerCase())) return;
    const matchedRecords = (n.records || []).map(r => normalizeRecord({ ...r })).filter(rec => {
      if (q.province && !(rec.regions || []).some(r => r.province === q.province)) return false;
      if (q.city && !(rec.regions || []).some(r => r.city === q.city)) return false;
      if (q.county && !(rec.regions || []).some(r => r.county === q.county)) return false;
      if (q.town && !(rec.regions || []).some(r => r.town === q.town)) return false;
      if (q.ethnic && rec.ethnic !== q.ethnic) return false;
      if (q.langPath && !(rec.langPaths || []).includes(q.langPath)) return false;
      if (q.commonName && !(rec.names || []).some(nm => nm.text === q.commonName)) return false;
      if (q.parts.length && !q.parts.every(p => (rec.usages||[]).some(u => (u.parts||[]).includes(p)))) return false;
      if (q.ways.length && !q.ways.every(w => (rec.usages||[]).some(u => (u.ways||[]).some(x => x.tag === w)))) return false;
      if (q.dish && !(rec.usages||[]).some(u => (u.ways||[]).some(x => (x.dish||'').toLowerCase().includes(q.dish.toLowerCase())))) return false;
      if (q.method && !(rec.usages||[]).some(u => (u.ways||[]).some(x => (x.method||'').toLowerCase().includes(q.method.toLowerCase())))) return false;
      return true;
    });
    if (matchedRecords.length) results.push({ node: n, records: matchedRecords });
  });
  closeModal();
  renderAdvResults(results);
}


function pathHasRank(nodeId, rankName, cn) {
  let cur = getNode(nodeId);
  while (cur) {
    if (cur.rankName === rankName && cur.cn === cn) return true;
    cur = cur.parentId ? getNode(cur.parentId) : null;
  }
  return false;
}

function renderAdvResults(results) {
  currentView = 'advResults';
  const el = document.getElementById('mainContent');
  document.getElementById('emptyState').style.display = 'none';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="index-page">
      <h2>🔍 搜索结果</h2>
      <div class="desc">共 ${results.length} 个物种符合条件</div>
      ${results.length ? results.map(({node, records}) => `
        <div class="record-list-item" onclick="selectNode('${node.id}')">
          <span class="li-title">${escapeHtml(node.chinese || '未命名')}</span>
          <span class="li-latin">${escapeHtml(node.latin || '')}</span>
          <span class="li-meta">${records.length} 条匹配记录</span>
        </div>`).join('') : '<div class="empty">无匹配结果</div>'}
    </div>`;
}

let toastTimer;
function toast(msg, warn) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('warn', !!warn);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function exportJSON() {
  const data = { nodes, langNodes, meta };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  a.download = `edobotany-${ts}.json`;
  a.click();
  toast('已导出');
}

async function importJSON(e) {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    toast('JSON 解析失败：' + err.message, true);
    e.target.value = '';
    return;
  }
  const list = Array.isArray(data) ? data : (data.nodes || []);
  if (!list.length) { toast('文件里没有 nodes 数据', true); e.target.value = ''; return; }
  const append = confirm('确定=追加，取消=替换当前数据');
  if (!append) {
    await dbClear('nodes'); await dbClear('langNodes'); await dbClear('meta');
  }
  for (const n of list) await dbPut('nodes', n);
  if (data.langNodes) for (const n of data.langNodes) await dbPut('langNodes', n);
  if (data.meta) for (const [k, v] of Object.entries(data.meta)) await dbPut('meta', { key: k, value: v });
  nodes = await dbGetAll('nodes');
  langNodes = await dbGetAll('langNodes');
  const metaArr = await dbGetAll('meta');
  meta = {};
  metaArr.forEach(m => { meta[m.key] = m.value; });
  renderTree(); renderMain();
  toast(`导入完成：${list.length} 个分类节点`);
  e.target.value = '';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function esc(s) { return String(s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function toggleFontMode() {
  const cur = localStorage.getItem('dhi_font_mode') || 'sans';
  const next = cur === 'sans' ? 'serif' : 'sans';
  localStorage.setItem('dhi_font_mode', next);
  document.body.classList.toggle('font-mode-sans', next === 'sans');
  document.body.classList.toggle('font-mode-serif', next === 'serif');
  toast(next === 'sans' ? '已切换为无衬线' : '已切换为衬线');
}

function getPinyinInitial(s) {
  if (!s) return '#';
  const ch = s.trim()[0];
  if (!ch) return '#';
  if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
  if (/[0-9]/.test(ch)) return '#';
  if (typeof pinyinPro !== 'undefined') {
    try {
      const p = pinyinPro.pinyin(ch, { pattern: 'first', toneType: 'none' });
      const letter = (p || '').toUpperCase().replace(/[^A-Z]/g, '');
      return letter || '#';
    } catch (e) { return '#'; }
  }
  return '#';
}

function getLatinInitial(s) {
  if (!s) return '#';
  const ch = s.trim()[0];
  if (!ch) return '#';
  const letter = ch.toUpperCase();
  return /[A-Z]/.test(letter) ? letter : '#';
}

/* 用字母分组渲染索引，避免每次输入重绘整个页面 */
function renderLetterGroups(el, title, entries, mapper, placeholder) {
  // entries: [{key, list}, ...]
  const mapped = entries.map(e => {
    const m = mapper(e);
    return { letter: m.letter, sortKey: m.sortKey, html: m.html };
  });
  mapped.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  const groups = {};
  mapped.forEach(m => {
    if (!groups[m.letter]) groups[m.letter] = [];
    groups[m.letter].push(m);
  });
  const letters = Object.keys(groups).sort();

  el.innerHTML = `<div class="index-page"><h2>${title}</h2><div class="desc">共 ${entries.length} 条。</div>
      <div class="index-search"><input placeholder="${placeholder}（回车搜索）" value="${escapeHtml(indexSearchQuery)}" oninput="onIndexSearchInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();onIndexSearchEnter();}" id="indexSearchInput"></div>
    <div id="indexGroups">${letters.map(letter => `
      <div class="dict-group">
        <div class="dict-letter">${escapeHtml(letter)}</div>
        ${groups[letter].map(g => g.html).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

function onIndexSearchInput(v) {
  indexSearchQuery = v;
  // 不再自动重渲染，等用户按回车
}
function onIndexSearchEnter() {
  renderIndexPage();
  const input = document.getElementById('indexSearchInput');
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

/* ============================================================
   标签管理
   ============================================================ */
const TAG_LIB_LABELS = {
  partsLib: '食用部位',
  waysLib: '食用方式',
  ethnicLib: '民族',
  customRanks: '自定义分类阶元',
  customLangRanks: '自定义语言阶元'
};

function openTagManager() {
  let html = `<h3>🏷️ 标签管理</h3>`;
  html += `<div class="hint" style="margin-bottom:0.8rem">点击 × 删除，点击文字重命名。删除会同步清理词条里的该 tag。重命名只改选项库，已录入的 tag 不会自动同步。</div>`;
  html += `<div style="display:flex;gap:0.8rem;align-items:flex-start;max-height:32rem;overflow-y:auto;padding-bottom:0.4rem">`;
  Object.entries(TAG_LIB_LABELS).forEach(([key, label]) => {
    const raw = meta[key] || [];
    const mapped = raw.map(t => ({ tag: t, letter: getPinyinInitial(t), sortKey: getPinyinForSort(t) }));
    mapped.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
    const groups = {};
    mapped.forEach(m => {
      if (!groups[m.letter]) groups[m.letter] = [];
      groups[m.letter].push(m.tag);
    });
    const letters = Object.keys(groups).sort();
    html += `<div style="flex:1 1 0;min-width:0;border-right:1px solid var(--border-light);padding-right:0.6rem">
      <div style="font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:0.45rem">${label} <span style="font-weight:400">(${raw.length})</span></div>`;
    if (!raw.length) {
      html += `<div style="font-size:0.8rem;color:var(--muted);padding:0.2rem 0">暂无</div>`;
    } else {
      letters.forEach(letter => {
        html += `<div style="margin-bottom:0.45rem">
          <div style="font-size:0.7rem;font-weight:700;color:var(--primary);margin-bottom:0.2rem">${escapeHtml(letter)}</div>
          <div style="display:flex;flex-direction:column;gap:0.25rem">`;
        groups[letter].forEach(t => {
          html += `<span style="display:inline-flex;align-items:center;justify-content:space-between;padding:0.15rem 0.3rem 0.15rem 0.5rem;border:1px solid var(--border);border-radius:0.6rem;font-size:0.78rem;background:var(--card)">
            <span style="cursor:pointer;padding-right:0.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="renameTag('${esc(key)}','${esc(t)}')" title="点击重命名">${escapeHtml(t)}</span>
            <span style="cursor:pointer;color:var(--danger);font-weight:700;padding:0.1rem 0.4rem;border-left:1px solid var(--border);line-height:1;flex-shrink:0" onclick="deleteTag('${esc(key)}','${esc(t)}')" title="删除">×</span>
          </span>`;
        });
        html += `</div></div>`;
      });
    }
    html += `</div>`;
  });
  html += `</div>`;
  html += `<div class="form-actions"><button onclick="closeModal()">关闭</button></div>`;
  // 用 lg 尺寸让模态框宽一些，五列才排得下
  openModal(html, 'lg');
}

async function deleteTag(libKey, tagValue) {
  if (!meta[libKey]) return;
  const isRankLib = libKey === 'customRanks' || libKey === 'customLangRanks';
  const libLabel = TAG_LIB_LABELS[libKey] || libKey;

  let confirmMsg = `确定从「${libLabel}」的选项库里删除「${tagValue}」？`;
  if (isRankLib) {
    confirmMsg += `\n\n这是阶元名，已建成的分类树节点不受影响，只是以后新建时不再有它作为候选。`;
  } else {
    confirmMsg += `\n\n所有词条里用到这个 tag 的地方也会一起清掉。`;
  }
  if (!confirm(confirmMsg)) return;
  if (!isRankLib) {
    if (!confirm(`再次确认：删除「${tagValue}」并从所有词条里清除？此操作不可撤销。`)) return;
  }

  // 1. 从 meta 里删
  meta[libKey] = meta[libKey].filter(t => t !== tagValue);
  await dbPut('meta', { key: libKey, value: meta[libKey] });

  // 2. 清理所有词条（只处理 tag 类库）
  if (!isRankLib) {
    let changed = 0;
    for (const node of nodes) {
      if (node.type !== 'species') continue;
      let nodeChanged = false;
      (node.records || []).forEach(rec => {
        if (libKey === 'partsLib') {
          (rec.usages || []).forEach(u => {
            if ((u.parts || []).includes(tagValue)) {
              u.parts = u.parts.filter(p => p !== tagValue);
              nodeChanged = true;
            }
          });
        } else if (libKey === 'waysLib') {
          (rec.usages || []).forEach(u => {
            (u.ways || []).forEach(w => {
              if (w.tag === tagValue) { w.tag = ''; nodeChanged = true; }
            });
          });
        } else if (libKey === 'ethnicLib') {
          if (rec.ethnic === tagValue) { rec.ethnic = ''; nodeChanged = true; }
        }
      });
      if (nodeChanged) {
        await dbPut('nodes', node);
        changed++;
      }
    }
    nodes = await dbGetAll('nodes');
    if (changed > 0) {
      renderTree();
      if (currentSelection) renderMain();
    }
    toast(`已删除「${tagValue}」，更新了 ${changed} 个词条`);
  } else {
    toast('已从选项库删除：' + tagValue);
  }

  openTagManager();
}

async function renameTag(libKey, oldValue) {
  const newValue = prompt(`重命名「${oldValue}」为：`, oldValue);
  if (newValue === null) return;
  const trimmed = newValue.trim();
  if (!trimmed) { toast('不能为空', true); return; }
  if (trimmed === oldValue) return;

  const isRankLib = libKey === 'customRanks' || libKey === 'customLangRanks';

  // 不允许重名
  if ((meta[libKey] || []).includes(trimmed)) {
    toast('「' + trimmed + '」已存在，不允许重名', true);
    return;
  }

  // 选项库里改名
  meta[libKey] = (meta[libKey] || []).map(t => t === oldValue ? trimmed : t);
  await dbPut('meta', { key: libKey, value: meta[libKey] });

  // 词条里同步改名（阶元库不动词条）
  if (!isRankLib) {
    let changed = 0;
    for (const node of nodes) {
      if (node.type !== 'species') continue;
      let nodeChanged = false;
      (node.records || []).forEach(rec => {
        if (libKey === 'partsLib') {
          (rec.usages || []).forEach(u => {
            u.parts = (u.parts || []).map(p => {
              if (p === oldValue) { nodeChanged = true; return trimmed; }
              return p;
            });
          });
        } else if (libKey === 'waysLib') {
          (rec.usages || []).forEach(u => {
            (u.ways || []).forEach(w => {
              if (w.tag === oldValue) { w.tag = trimmed; nodeChanged = true; }
            });
          });
        } else if (libKey === 'ethnicLib') {
          if (rec.ethnic === oldValue) { rec.ethnic = trimmed; nodeChanged = true; }
        }
      });
      if (nodeChanged) {
        await dbPut('nodes', node);
        changed++;
      }
    }
    nodes = await dbGetAll('nodes');
    if (changed > 0) {
      renderTree();
      if (currentSelection) renderMain();
    }
    toast(`已重命名为「${trimmed}」，更新了 ${changed} 个词条`);
  } else {
    toast('已从选项库重命名：' + oldValue + ' → ' + trimmed);
  }

  openTagManager();
}

/* 跳转到地区索引并按省过滤 */
function jumpToRegion(province) {
  if (!province) return;
  switchIndex('region', province);
}

/* 跳转到语言树并定位到该语言的节点 */
function jumpToLang(langPath) {
  if (!langPath) return;
  // 在语言树里按完整路径找到对应节点
  const parts = langPath.split(' > ');
  let cur = getLangNode('lang_root');
  if (!cur) return;
  for (const part of parts) {
    const next = (cur.children || [])
      .map(cid => getLangNode(cid))
      .find(c => c && c.cn === part);
    if (!next) { toast('未找到该语言节点：' + part, true); return; }
    cur = next;
  }
  // 切到语言树
  currentTreeType = 'lang';
  document.querySelectorAll('.tree-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.tree === 'lang');
  });
  updateSearchPlaceholder();
  document.getElementById('searchInput').value = '';
  treeSearchQuery = '';
  currentSelection = cur.id;
  currentView = 'content';
  expandedLangNodes = new Set();
  expandAncestors(cur.id, 'lang');
  renderTree();
  renderMain();
  scrollTreeToSelected();
}
