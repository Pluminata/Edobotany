function openDB() {
  return Promise.resolve();

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    console.warn('localStorage 读取失败：' + key, e);
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('localStorage 写入失败：' + key, e);
    toast('存储空间不足或浏览器拒绝写入', true);
  }
}

function dbPut(store, obj) {
  if (store === 'nodes') {
    const list = lsGet('dhi_nodes', []);
    const idx = list.findIndex(x => x.id === obj.id);
    if (idx >= 0) list[idx] = obj; else list.push(obj);
    lsSet('dhi_nodes', list);
    return Promise.resolve();
  }
  if (store === 'langNodes') {
    const list = lsGet('dhi_lang_nodes', []);
    const idx = list.findIndex(x => x.id === obj.id);
    if (idx >= 0) list[idx] = obj; else list.push(obj);
    lsSet('dhi_lang_nodes', list);
    return Promise.resolve();
  }
  if (store === 'meta') {
    const map = lsGet('dhi_meta', {});
    map[obj.key] = obj.value;
    lsSet('dhi_meta', map);
    return Promise.resolve();
  }
  if (store === 'regionCache') {
    lsSet('dhi_region_cache', obj.value);
    return Promise.resolve();
  }
  return Promise.resolve();
}

function dbGetAll(store) {
  if (store === 'nodes') return Promise.resolve(lsGet('dhi_nodes', []));
  if (store === 'langNodes') return Promise.resolve(lsGet('dhi_lang_nodes', []));
  if (store === 'meta') {
    const map = lsGet('dhi_meta', {});
    return Promise.resolve(Object.entries(map).map(([k, v]) => ({ key: k, value: v })));
  }
  if (store === 'regionCache') {
    const v = lsGet('dhi_region_cache', null);
    return Promise.resolve(v ? [{ key: 'data', value: v }] : []);
  }
  return Promise.resolve([]);
}

function dbGet(store, key) {
  if (store === 'regionCache') {
    const v = lsGet('dhi_region_cache', null);
    return Promise.resolve(v ? { key: 'data', value: v } : undefined);
  }
  return Promise.resolve(undefined);
}

function dbDelete(store, id) {
  if (store === 'nodes') {
    const list = lsGet('dhi_nodes', []).filter(x => x.id !== id);
    lsSet('dhi_nodes', list);
    return Promise.resolve();
  }
  if (store === 'langNodes') {
    const list = lsGet('dhi_lang_nodes', []).filter(x => x.id !== id);
    lsSet('dhi_lang_nodes', list);
    return Promise.resolve();
  }
  return Promise.resolve();
}

function dbClear(store) {
  if (store === 'nodes') lsSet('dhi_nodes', []);
  else if (store === 'langNodes') lsSet('dhi_lang_nodes', []);
  else if (store === 'meta') lsSet('dhi_meta', {});

}

const REGION_CDN = 'https://cdn.jsdelivr.net/npm/china-area-data@5.0.1/data.json';
async function loadRegionData() {
  if (REGION_DATA) return REGION_DATA;
  if (regionLoadPromise) return regionLoadPromise;
  regionLoadPromise = (async () => {
    const cached = await dbGet('regionCache', 'data');
    if (cached && cached.value) { REGION_DATA = cached.value; return REGION_DATA; }
    try {
      const resp = await fetch(REGION_CDN);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const raw = await resp.json();
      const provinceMap = raw['86'] || {};
      const result = {};
      Object.entries(provinceMap).forEach(([pCode, pName]) => {
        if (pCode === '710000' || pCode === '810000' || pCode === '820000') return;
        result[pName] = {};
        const cityMap = raw[pCode] || {};
        Object.entries(cityMap).forEach(([cCode, cName]) => {
          result[pName][cName] = {};
          const countyMap = raw[cCode] || {};
          Object.entries(countyMap).forEach(([coCode, coName]) => { result[pName][cName][coName] = coCode; });
        });
      });
      REGION_DATA = result;
      await dbPut('regionCache', { key: 'data', value: result });
      return result;
    } catch (e) {
      console.warn('省市区数据加载失败', e);
      REGION_DATA = {};
      return REGION_DATA;
    }
  })();
  return regionLoadPromise;
}

async function prebuildTaxonTree() {
  const root = getNode('root');
  if (!root) return;
  if (!root.children) root.children = [];
  async function buildRank(parentId, rankName, cn, latin) {
    const id = 'prebuilt_' + rankName + '_' + cn;
    let node = getNode(id);
    if (node) {
      if (node.parentId !== parentId) { node.parentId = parentId; await dbPut('nodes', node); }
      return id;
    }
    node = { id, type: 'rank', rankName, cn, latin, parentId, children: [], photos: [] };
    await dbPut('nodes', node);
    nodes.push(node);
    return id;
  }
  for (const [phylumCn, phylumData] of Object.entries(SEED_TAXON_TREE)) {
    const phylumId = await buildRank('root', '门', phylumCn, phylumData.latin);
    const phylumNode = getNode(phylumId);
    if (!phylumNode.children) phylumNode.children = [];
    for (const [classCn, classData] of Object.entries(phylumData.classes)) {
      const classId = await buildRank(phylumId, '纲', classCn, classData.latin);
      const classNode = getNode(classId);
      if (!classNode.children) classNode.children = [];
      for (const [orderCn, orderData] of Object.entries(classData.orders)) {
        const orderId = await buildRank(classId, '目', orderCn, orderData.latin);
        const orderNode = getNode(orderId);
        if (!orderNode.children) orderNode.children = [];
        for (const fam of (orderData.families || [])) {
          const famId = await buildRank(orderId, '科', fam.cn, fam.latin);
          if (!orderNode.children.includes(famId)) orderNode.children.push(famId);
        }
        await dbPut('nodes', orderNode);
        if (!classNode.children.includes(orderId)) classNode.children.push(orderId);
      }
      await dbPut('nodes', classNode);
      if (!phylumNode.children.includes(classId)) phylumNode.children.push(classId);
    }
    await dbPut('nodes', phylumNode);
    if (!root.children.includes(phylumId)) root.children.push(phylumId);
    await dbPut('nodes', root);
  }
}

async function prebuildLangTree() {
  const root = getLangNode('lang_root');
  if (!root) return;
  if (!root.children) root.children = [];
  for (const cn of PREBUILD_LANG_TREE_TOP) {
    const id = 'prebuilt_lang_语系_' + cn;
    let node = getLangNode(id);
    if (node) {
      if (node.parentId !== 'lang_root') { node.parentId = 'lang_root'; await dbPut('langNodes', node); }
      if (!root.children.includes(id)) { root.children.push(id); await dbPut('langNodes', root); }
      continue;
    }
    node = { id, type: 'langRank', rankName: '语系', cn, latin: '', parentId: 'lang_root', children: [], photos: [] };
    await dbPut('langNodes', node);
    langNodes.push(node);
    root.children.push(id);
  }
  await dbPut('langNodes', root);
}

function getNode(id) { return nodes.find(n => n.id === id); }
function getLangNode(id) { return langNodes.find(n => n.id === id); }
function getCurrentTree() { return currentTreeType === 'taxon' ? nodes : langNodes; }
function getChildren(id) {
  const n = currentTreeType === 'taxon' ? getNode(id) : getLangNode(id);
  if (!n) return [];
  const list = currentTreeType === 'taxon' ? nodes : langNodes;
  return (n.children || []).map(cid => list.find(x => x.id === cid)).filter(Boolean);
}

function getPinyinForSort(s) {
  if (!s) return '';
  if (typeof pinyinPro !== 'undefined') {
    try { return pinyinPro.pinyin(s, { toneType: 'none', type: 'array' }).join(''); }
    catch (e) { return s; }
  }
  return s;
}

function sortTreeChildren(children) {
  if (treeSortMode === 'none') return children;
  const copy = children.slice();
  copy.sort((a, b) => {
    if (treeSortMode === 'latin') {
      const la = (a.latin || '').toLowerCase();
      const lb = (b.latin || '').toLowerCase();
      if (!la && !lb) return (a.cn || a.chinese || '').localeCompare(b.cn || b.chinese || '', 'zh');
      if (!la) return 1;
      if (!lb) return -1;
      return la.localeCompare(lb);
    }
    const na = a.cn || a.chinese || '';
    const nb = b.cn || b.chinese || '';
    return getPinyinForSort(na).localeCompare(getPinyinForSort(nb));
  });
  return copy;
}

function setTreeSort(mode) {
  treeSortMode = mode;
  localStorage.setItem('dhi_tree_sort', mode);
  renderTree();
  toast('已切换为：' + (mode === 'pinyin' ? '按中文拼音' : mode === 'latin' ? '按拉丁字母' : '按添加顺序'));
}

function expandAncestors(nodeId, treeType) {
  const isLang = treeType === 'lang';
  const list = isLang ? langNodes : nodes;
  const set = isLang ? expandedLangNodes : expandedNodes;
  const rootId = isLang ? 'lang_root' : 'root';
  function findPath(currentId, targetId, visited) {
    if (currentId === targetId) return [currentId];
    if (visited.has(currentId)) return null;
    visited.add(currentId);
    const cur = list.find(n => n.id === currentId);
    if (!cur) return null;
    for (const childId of (cur.children || [])) {
      const path = findPath(childId, targetId, visited);
      if (path) return [currentId, ...path];
    }
    return null;
  }
  const path = findPath(rootId, nodeId, new Set());
  if (path) {
    path.forEach(id => set.add(id));
  } else {
    let cur = list.find(n => n.id === nodeId);
    while (cur) {
      set.add(cur.id);
      cur = cur.parentId ? list.find(n => n.id === cur.parentId) : null;
    }
  }
}

function renderTree() {
  sortables.forEach(s => s.destroy());
  sortables = [];
  const root = document.getElementById('treeRoot');
  root.innerHTML = '';
  if (currentTreeType === 'taxon') {
    const rootNode = getNode('root');
    if (!rootNode) return;
    renderTreeNode(root, rootNode, 0);
  } else {
    const rootNode = getLangNode('lang_root');
    if (!rootNode) return;
    const rootChildren = sortTreeChildren((rootNode.children || []).map(cid => getLangNode(cid)).filter(Boolean));
    rootChildren.forEach(c => renderLangTreeNode(root, c, 0));
  }
}

function renderTreeNode(container, node, depth) {
  const isExpanded = expandedNodes.has(node.id) || depth === 0;
  const isActive = currentSelection === node.id && currentTreeType === 'taxon';
  const children = sortTreeChildren(getChildren(node.id));
  if (treeSearchQuery && currentTreeType === 'taxon') {
    const q = treeSearchQuery.toLowerCase();
    if (!nodeMatchesSearch(node, q)) return;
  }
  const nodeDiv = document.createElement('div');
  nodeDiv.className = 'tree-node';
  nodeDiv.dataset.nodeId = node.id;
  const label = document.createElement('div');
  label.className = 'node-label' + (isActive ? ' active' : '');
  const hasChildren = children.length > 0;
  const isSpecies = node.type === 'species';
  label.innerHTML = `
    ${editMode ? '<span class="drag-handle" title="拖动">⋮⋮</span>' : ''}
    <span class="arrow ${isExpanded ? 'open' : ''}">${hasChildren && !isSpecies ? '▶' : ''}</span>
    <span class="name">${escapeHtml(node.cn || node.chinese || '未命名')}</span>
    ${node.latin ? `<span class="latin ${isUprightRank(node.rankName) ? 'upright' : ''}">${escapeHtml(node.latin)}</span>` : ''}
    ${node.rankName && !isSpecies ? `<span class="rank">${escapeHtml(node.rankName)}</span>` : ''}
    ${hasChildren && isSpecies ? `<span class="count">${children.length}</span>` : (hasChildren ? `<span class="count">${countDescendants(node.id)}</span>` : '')}
  `;
  label.onclick = (e) => {
    if (e.target.closest('.drag-handle')) return;
    e.stopPropagation();
    if (hasChildren && !isSpecies) {
      if (expandedNodes.has(node.id)) expandedNodes.delete(node.id);
      else expandedNodes.add(node.id);
      renderTree();
    }
    currentSelection = node.id;
    currentView = 'content';
    renderTree();
    renderMain();
  };
  nodeDiv.appendChild(label);
  if (isExpanded && hasChildren) {
    const childContainer = document.createElement('div');
    childContainer.className = 'tree-children';
    childContainer.dataset.parentId = node.id;
    nodeDiv.appendChild(childContainer);
    const rankChildren = children.filter(c => c.type === 'rank');
    const spChildren = children.filter(c => c.type !== 'rank');
    rankChildren.forEach(c => renderTreeNode(childContainer, c, depth + 1));
    spChildren.forEach(c => renderTreeNode(childContainer, c, depth + 1));
    if (editMode) bindSortable(childContainer, node, 'taxon');
  }
  container.appendChild(nodeDiv);
}

function renderLangTreeNode(container, node, depth) {
  const isExpanded = expandedLangNodes.has(node.id) || depth === 0;
  const isActive = currentSelection === node.id && currentTreeType === 'lang';
  const children = sortTreeChildren((node.children || []).map(cid => getLangNode(cid)).filter(Boolean));
  if (treeSearchQuery && currentTreeType === 'lang') {
    const q = treeSearchQuery.toLowerCase();
    if (!langNodeMatchesSearch(node, q)) return;
  }
  const nodeDiv = document.createElement('div');
  nodeDiv.className = 'tree-node';
  nodeDiv.dataset.nodeId = node.id;
  const label = document.createElement('div');
  label.className = 'node-label' + (isActive ? ' active' : '');
  const hasChildren = children.length > 0;
  label.innerHTML = `
    ${editMode ? '<span class="drag-handle" title="拖动">⋮⋮</span>' : ''}
    <span class="arrow ${isExpanded ? 'open' : ''}">${hasChildren ? '▶' : ''}</span>
    <span class="name">${escapeHtml(node.cn || '未命名')}</span>
    ${node.rankName ? `<span class="rank">${escapeHtml(node.rankName)}</span>` : ''}
    ${hasChildren ? `<span class="count">${countLangDescendants(node.id)}</span>` : ''}
  `;
  label.onclick = (e) => {
    if (e.target.closest('.drag-handle')) return;
    e.stopPropagation();
    if (hasChildren) {
      if (expandedLangNodes.has(node.id)) expandedLangNodes.delete(node.id);
      else expandedLangNodes.add(node.id);
      renderTree();
    }
    currentSelection = node.id;
    currentView = 'content';
    renderTree();
    renderMain();
  };
  nodeDiv.appendChild(label);
  if (isExpanded && hasChildren) {
    const childContainer = document.createElement('div');
    childContainer.className = 'tree-children';
    childContainer.dataset.parentId = node.id;
    nodeDiv.appendChild(childContainer);
    children.forEach(c => renderLangTreeNode(childContainer, c, depth + 1));
    if (editMode) bindSortable(childContainer, node, 'lang');
  }
  container.appendChild(nodeDiv);
}

function countDescendants(id) {
  const children = getChildren(id);
  let n = children.length;
  children.forEach(c => { n += countDescendants(c.id); });
  return n;
}
function countLangDescendants(id) {
  const n = getLangNode(id);
  if (!n) return 0;
  let count = (n.children || []).length;
  (n.children || []).forEach(cid => { count += countLangDescendants(cid); });
  return count;
}
function nodeMatchesSearch(node, q) {
  if ((node.cn || '').toLowerCase().includes(q)) return true;
  if ((node.chinese || '').toLowerCase().includes(q)) return true;
  if ((node.latin || '').toLowerCase().includes(q)) return true;
  if ((node.records || []).some(rec => (rec.name || '').toLowerCase().includes(q))) return true;
  return getChildren(node.id).some(c => nodeMatchesSearch(c, q));
}
function langNodeMatchesSearch(node, q) {
  if ((node.cn || '').toLowerCase().includes(q)) return true;
  const list = langNodes;
  return (node.children || []).map(cid => list.find(x => x.id === cid)).filter(Boolean).some(c => langNodeMatchesSearch(c, q));
}

function scrollTreeToSelected() {
  if (!currentSelection) return;
  setTimeout(() => {
    const treeRoot = document.getElementById('treeRoot');
    if (!treeRoot) return;
    const activeEl = treeRoot.querySelector('.node-label.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 50);
}

function onTreeSearch(v) {
  treeSearchQuery = v;
  if (!v) {
    if (currentSelection) {
      if (currentTreeType === 'taxon') expandedNodes = new Set();
      else expandedLangNodes = new Set();
      expandAncestors(currentSelection, currentTreeType);
    }
    renderTree();
    scrollTreeToSelected();
    return;
  }
  const q = v.toLowerCase();
  if (currentTreeType === 'taxon') {
    function expandPath(node) {
      if (nodeMatchesSearch(node, q)) expandedNodes.add(node.id);
      getChildren(node.id).forEach(expandPath);
    }
    expandPath(getNode('root'));
  } else {
    function expandLangPath(node) {
      if (langNodeMatchesSearch(node, q)) expandedLangNodes.add(node.id);
      const list = langNodes;
      (node.children || []).map(cid => list.find(x => x.id === cid)).filter(Boolean).forEach(expandLangPath);
    }
    const root = getLangNode('lang_root');
    (root.children || []).map(cid => getLangNode(cid)).filter(Boolean).forEach(expandLangPath);
  }
  renderTree();
  if (currentSelection) scrollTreeToSelected();
}

function bindSortable(container, parentNode, treeType) {
  const s = Sortable.create(container, {
    group: 'taxon-tree-' + treeType, animation: 150, handle: '.drag-handle',
    draggable: '.tree-node', ghostClass: 'dragging',
    onEnd: function(evt) {
      const itemEl = evt.item;
      const nodeId = itemEl.dataset.nodeId;
      if (!nodeId) { renderTree(); return; }
      const list = treeType === 'taxon' ? nodes : langNodes;
      const dragged = list.find(n => n.id === nodeId);
      if (!dragged) { renderTree(); return; }
      const toParentId = evt.to.dataset.parentId;
      if (!toParentId) { renderTree(); return; }
      const newParent = list.find(n => n.id === toParentId);
      const oldParent = list.find(n => n.id === dragged.parentId);
      if (oldParent && newParent && oldParent.id === newParent.id && evt.oldIndex === evt.newIndex) return;

      let msg = `将「${dragged.cn || dragged.chinese}」移动到「${newParent.cn || newParent.chinese}」下？`;
      if (oldParent && newParent && oldParent.id !== newParent.id) msg += `\n\n注意：这是跨父节点移动。`;
      if (treeType === 'lang') msg += `\n\n词条里挂在该语言（及其子语言）下的 langPaths 会同步更新。`;
      if (!confirm(msg)) { renderTree(); return; }

      const oldPaths = {};
      if (treeType === 'lang') {
        function walk(id) {
          const n = list.find(x => x.id === id);
          if (!n) return;
          if (id !== 'lang_root') oldPaths[id] = buildLangPath(id);
          (n.children || []).forEach(walk);
        }
        walk(dragged.id);
      }

      if (oldParent) {
        oldParent.children = (oldParent.children || []).filter(id => id !== dragged.id);
      }
      if (!newParent.children) newParent.children = [];
      newParent.children.push(dragged.id);
      dragged.parentId = newParent.id;

      const store = treeType === 'taxon' ? 'nodes' : 'langNodes';
      const writes = [];
      if (oldParent) writes.push(dbPut(store, oldParent));
      writes.push(dbPut(store, newParent));
      writes.push(dbPut(store, dragged));

      Promise.all(writes).then(async () => {
        const fresh = await dbGetAll(store);
        if (treeType === 'taxon') nodes = fresh; else langNodes = fresh;

        if (treeType === 'lang') {
          const sortedOldPaths = Object.entries(oldPaths).sort((a, b) => b[1].length - a[1].length);
          let changed = 0;
          for (const sp of nodes) {
            if (sp.type !== 'species') continue;
            let nodeChanged = false;
            (sp.records || []).forEach(rec => {
              const lps = rec.langPaths || (rec.langPath ? [rec.langPath] : []);
              if (!lps.length) return;
              let localChanged = false;
              const newPaths = lps.map(lp => {
                for (const [nid, oldPath] of sortedOldPaths) {
                  if (lp === oldPath || lp.startsWith(oldPath + ' > ')) {
                    localChanged = true;
                    return buildLangPath(nid) + lp.slice(oldPath.length);
                  }
                }
                return lp;
              });
              if (localChanged) {
                rec.langPaths = newPaths;
                delete rec.langPath;
                nodeChanged = true;
              }
            });
            if (nodeChanged) {
              await dbPut('nodes', sp);
              changed++;
            }
          }
          if (changed > 0) {
            nodes = await dbGetAll('nodes');
            renderMain();
          }
          toast(changed > 0 ? `已移动，同步了 ${changed} 个词条` : '已移动');
        } else {
          toast('已移动');
        }
        renderTree();
      });
    }
  });
  sortables.push(s);
}

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editToggleBtn');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '✓ 编辑模式' : '✎ 编辑模式';
  document.body.classList.toggle('edit-mode', editMode);
  renderTree();
  if (currentSelection) renderMain();
  toast(editMode ? '编辑模式已开启' : '编辑模式已关闭');
}

function renderMain() {
  const emptyState = document.getElementById('emptyState');
  const mainContent = document.getElementById('mainContent');
  if (currentView !== 'content' || !currentSelection) {
    emptyState.style.display = 'flex';
    mainContent.style.display = 'none';
    if (currentView !== 'content') renderIndexPage();
    return;
  }
  emptyState.style.display = 'none';
  mainContent.style.display = 'block';
  const node = getCurrentTree().find(n => n.id === currentSelection);
  if (!node) { currentSelection = null; renderMain(); return; }
  if (currentTreeType === 'taxon') {
    if (node.type === 'species') renderSpeciesDetail(node);
    else renderRankView(node);
  } else {
    renderLangRankView(node);
  }
}

function renderRankView(node) {
  const children = sortTreeChildren(getChildren(node.id));
  const rankChildren = children.filter(c => c.type === 'rank');
  const spChildren = children.filter(c => c.type !== 'rank');
  const el = document.getElementById('mainContent');
  const path = buildPath(node.id);
  el.innerHTML = `
    <div class="main-header">
      <div class="title-block">
        <h2>${escapeHtml(node.cn || '')} ${node.latin ? `<span style="font-family:var(--serif);${isUprightRank(node.rankName) ? '' : 'font-style:italic;'}font-size:1rem;color:var(--muted);font-weight:400">${escapeHtml(node.latin)}</span>` : ''}</h2>
        <div class="taxon-line">${escapeHtml(path)}</div>
        <div class="taxon-line" style="margin-top:0.1rem">${rankChildren.length} 个子阶元 · ${spChildren.length} 个物种/词条</div>
      </div>
      <div class="actions">
        ${editMode ? `
          <button class="mini" onclick="openAddRankModal('${node.id}', 'taxon')">+ 子阶元</button>
          <button class="mini primary" onclick="openAddSpeciesModal('${node.id}')">+ 物种</button>
          <button class="mini" onclick="openEditRankNodeModal('${node.id}', 'taxon')">编辑此节点</button>
        ` : ''}
        <div class="view-toggle">
          <button class="${viewMode==='card'?'active':''}" onclick="setViewMode('card')">平铺</button>
          <button class="${viewMode==='list'?'active':''}" onclick="setViewMode('list')">列表</button>
          <button class="${viewMode==='detail'?'active':''}" onclick="setViewMode('detail')">详情</button>
        </div>
      </div>
    </div>
    <div style="margin-bottom:0.95rem">
      <div style="font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:0.35rem">图片（第一张为封面）</div>
      ${editMode ? `<label class="upload-btn">+ 上传图片<input type="file" accept="image/*" multiple onchange="onNodePhotoUpload(event, '${node.id}', 'taxon')"></label>` : ''}
      <div class="photo-edit-grid" id="nodePhotoGrid_${node.id}"></div>
    </div>
    <div class="card-area" id="cardArea"></div>
  `;
  renderNodePhotoGrid(node.id, 'taxon');
  renderCardArea(children);
}

function renderLangRankView(node) {
  const children = sortTreeChildren((node.children || []).map(cid => getLangNode(cid)).filter(Boolean));
  const el = document.getElementById('mainContent');
  const path = buildLangPath(node.id);
  const langNodeIds = collectLangDescendantPaths(node.id);
  const allRecords = [];
  nodes.forEach(n => {
    if (n.type !== 'species') return;
    (n.records || []).forEach(rec => {
      const norm = normalizeRecord({ ...rec });
      const lps = norm.langPaths || [];
      if (!lps.length) return;
      if (lps.some(lp => langNodeIds.some(p => lp === p || lp.startsWith(p + ' > ')))) {
        allRecords.push({ node: n, rec: norm });
      }
    });
  });

  const sortedRecords = allRecords.slice().sort((a, b) => {
    const na = (a.rec.names[0] && a.rec.names[0].text) || a.node.chinese || '';
    const nb = (b.rec.names[0] && b.rec.names[0].text) || b.node.chinese || '';
    return getPinyinForSort(na).localeCompare(getPinyinForSort(nb));
  });
  const groups = {};
  sortedRecords.forEach(x => {
    const nm = (x.rec.names[0] && x.rec.names[0].text) || x.node.chinese || '';
    const letter = getPinyinInitial(nm);
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(x);
  });
  const letters = Object.keys(groups).sort();

  const childList = children.map(c => `
    <div class="record-list-item" style="padding:0.4rem 0.6rem" onclick="selectNode('${c.id}')">
      <span class="li-title" style="font-size:0.85rem">${escapeHtml(c.cn)}</span>
      ${c.rankName ? `<span class="li-latin" style="font-style:normal;font-size:0.7rem">${escapeHtml(c.rankName)}</span>` : ''}
    </div>
  `).join('');

  el.innerHTML = `
    <div class="main-header">
      <div class="title-block">
        <h2>${escapeHtml(node.cn || '')}</h2>
        <div class="taxon-line">${escapeHtml(path)}</div>
        <div class="taxon-line" style="margin-top:0.1rem">${node.rankName ? node.rankName + ' · ' : ''}${children.length} 个子项 · ${allRecords.length} 条植物俗名记录</div>
      </div>
      <div class="actions">
        ${editMode ? `
          <button class="mini" onclick="openAddRankModal('${node.id}', 'lang')">+ 子阶元</button>
          <button class="mini" onclick="openEditLangNodeModal('${node.id}')">编辑此节点</button>
        ` : ''}
      </div>
    </div>
    <div style="margin-bottom:0.6rem">
      <div style="font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:0.35rem">图片（第一张为封面）</div>
      ${editMode ? `<label class="upload-btn">+ 上传图片<input type="file" accept="image/*" multiple onchange="onNodePhotoUpload(event, '${node.id}', 'lang')"></label>` : ''}
      <div class="photo-edit-grid" id="nodePhotoGrid_${node.id}"></div>
    </div>
    ${allRecords.length ? `
    <div class="lang-split">
      <div class="lang-split-left">
        <div class="lang-split-title">子节点</div>
        ${children.length ? `<div class="record-list">${childList}</div>` : '<div class="empty" style="padding:0.6rem;font-size:0.75rem">无</div>'}
      </div>
      <div class="lang-split-right">
        <div class="lang-split-title">该语言下的植物俗名</div>
        ${letters.map(letter => `
          <div class="dict-group" style="margin-bottom:0.6rem">
            <div class="dict-letter" style="font-size:0.75rem;padding-bottom:0.15rem;margin-bottom:0.25rem">${escapeHtml(letter)}</div>
            ${groups[letter].map(({node: sp, rec}) => `
              <div class="record-list-item" style="padding:0.4rem 0.6rem" onclick="selectNode('${sp.id}')">
                <span class="li-title" style="font-size:0.85rem">${escapeHtml((rec.names[0] && rec.names[0].text) || sp.chinese || '')}</span>
                ${sp.latin ? `<span class="li-latin" style="font-size:0.72rem">${escapeHtml(sp.latin)}</span>` : ''}
                <span class="li-meta" style="font-size:0.7rem">${escapeHtml(sp.chinese || '')}</span>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    </div>
    ` : `
      <div class="lang-split-title" style="margin-top:0.6rem">子节点</div>
      ${children.length ? `<div class="record-list">${childList}</div>` : '<div class="empty" style="padding:1.2rem">无子节点</div>'}
    `}
  `;
  renderNodePhotoGrid(node.id, 'lang');
}


/* 收集某个语言节点及其所有后代的完整路径（用于匹配 records[].langPath） */
function collectLangDescendantPaths(rootId) {
  const result = [];
  function walk(id) {
    const n = getLangNode(id);
    if (!n) return;
    if (id !== 'lang_root') result.push(buildLangPath(id));
    (n.children || []).forEach(walk);
  }
  walk(rootId);
  return result;
}

function renderLangCardArea(children) {
  const area = document.getElementById('cardArea');
  if (!area) return;
  if (!children.length) { area.innerHTML = '<div class="empty"><div class="big">🗣️</div>该语言节点下暂无子项</div>'; return; }
  area.innerHTML = `<div class="record-grid">${children.map(c => {
    const photos = c.photos || [];
    const img = photos.length ? `<img class="card-img" src="${photos[0]}">` : `<div class="card-img placeholder">🗣️ ${escapeHtml(c.rankName || '')}</div>`;
    return `<div class="record-card" onclick="selectNode('${c.id}')">
      ${img}
      <div class="card-body">
        <div class="card-name">${escapeHtml(c.cn)}</div>
        <div class="card-meta">${(c.children || []).length ? `<span class="tag">${c.children.length} 子项</span>` : ''}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderCardArea(children) {
  const area = document.getElementById('cardArea');
  if (!area) return;
  if (!children.length) { area.innerHTML = '<div class="empty"><div class="big">🌱</div>该分类下暂无内容</div>'; return; }
  if (viewMode === 'list') area.innerHTML = `<div class="record-list">${children.map(c => renderListItem(c)).join('')}</div>`;
  else if (viewMode === 'detail') {
    const first = children[0];
    if (first.type === 'species') renderSpeciesDetail(first, true);
    else renderRankView(first);
  } else {
    area.innerHTML = `<div class="record-grid">${children.map(c => renderCard(c)).join('')}</div>`;
  }
}

function renderListItem(node) {
  const isSpecies = node.type === 'species';
  const children = getChildren(node.id);
  const meta = isSpecies
    ? (node.records || []).slice(0, 2).map(r => r.name).filter(Boolean).join(' · ')
    : `${node.rankName || ''} ${children.length ? '· ' + children.length + ' 子项' : ''}`;
  return `<div class="record-list-item" onclick="selectNode('${node.id}')">
    <span class="li-title">${escapeHtml(node.cn || node.chinese || '未命名')}</span>
    ${node.latin ? `<span class="li-latin ${isUprightRank(node.rankName) ? 'upright' : ''}">${escapeHtml(node.latin)}</span>` : ''}
    <span class="li-meta">${escapeHtml(meta)}</span>
  </div>`;
}

function getSpeciesCover(node) {
  if (node.coverPhoto) {
    let exists = false;
    (node.records || []).forEach(rec => {
      (rec.usages || []).forEach(u => {
        (u.ways || []).forEach(w => {
          if (w.photos && w.photos.includes(node.coverPhoto)) exists = true;
        });
      });
    });
    if (exists) return node.coverPhoto;
  }
  for (const rec of (node.records || [])) {
    for (const u of (rec.usages || [])) {
      for (const w of (u.ways || [])) {
        if (w.photos && w.photos.length) return w.photos[0];
      }
    }
  }
  return '';
}

function renderCard(node) {
  const isSpecies = node.type === 'species';
  if (!isSpecies) {
    const children = getChildren(node.id);
    const photos = node.photos || [];
    const img = photos.length ? `<img class="card-img" src="${photos[0]}">` : `<div class="card-img placeholder">📁 ${escapeHtml(node.rankName || '阶元')}</div>`;
    const rankChildren = children.filter(c => c.type === 'rank').length;
    const spChildren = children.filter(c => c.type !== 'rank').length;
    return `<div class="record-card" onclick="selectNode('${node.id}')">
      ${img}
      <div class="card-body">
        <div class="card-name">${escapeHtml(node.cn || '未命名')}</div>
        <div class="card-latin ${isUprightRank(node.rankName) ? 'upright' : ''}">${escapeHtml(node.latin || '')}</div>
        <div class="card-meta">
          ${rankChildren ? `<span class="tag">${rankChildren} 子阶元</span>` : ''}
          ${spChildren ? `<span class="tag way">${spChildren} 物种</span>` : ''}
        </div>
      </div>
    </div>`;
  }
  const cover = getSpeciesCover(node);
  const img = cover ? `<img class="card-img" src="${cover}">` : `<div class="card-img placeholder">暂无照片</div>`;
  const firstRec = normalizeRecord({ ...((node.records || [])[0] || {}) });
  const firstName = (firstRec.names || [])[0] || {};
  const firstRegion = (firstRec.regions || [])[0];
  const region = firstRegion ? formatRegion(firstRegion) : '';
  return `<div class="record-card" onclick="selectNode('${node.id}')">
    ${img}
    <div class="card-body">
      <div class="card-ipa">${escapeHtml(firstName.ipa || '')}</div>
      <div class="card-name">${escapeHtml(node.chinese || '未命名')}</div>
      <div class="card-latin">${escapeHtml(node.latin || '')}${node.author ? ` <span style="font-style:normal;font-size:0.7rem;color:var(--muted)">${escapeHtml(node.author)}</span>` : ''}</div>
      <div class="card-meta">
        ${(firstRec.usages || []).flatMap(u => u.parts || []).slice(0, 2).map(p => `<span class="tag">${escapeHtml(p)}</span>`).join('')}
        ${(firstRec.usages || []).flatMap(u => (u.ways || []).map(w => w.tag)).slice(0, 2).map(w => `<span class="tag way">${escapeHtml(w)}</span>`).join('')}
        ${region ? `<span class="tag region">${escapeHtml(region)}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function renderSpeciesDetail(node, keepInArea) {
  const el = keepInArea ? document.getElementById('cardArea') : document.getElementById('mainContent');
  if (!el) return;
  const path = buildPath(node.id);
  const records = node.records || [];
  const cover = getSpeciesCover(node);
  el.innerHTML = `
    ${!keepInArea ? `<div class="main-header">
      <div class="title-block"><h2>${escapeHtml(node.chinese || '未命名')}</h2><div class="taxon-line">${escapeHtml(path)}</div></div>
      <div class="actions"><div class="view-toggle"><button onclick="backToList()">返回列表</button></div></div>
    </div>` : ''}
    <div class="detail-wrap">
      <div class="detail-card">
        <h3>${escapeHtml(node.chinese || '未命名')}</h3>
        ${node.latin ? `<div class="latin-big">${escapeHtml(node.latin)}${node.author ? `<span class="author">${escapeHtml(node.author)}</span>` : ''}</div>` : ''}
        ${cover ? `<div style="margin-top:0.8rem"><img src="${cover}" style="max-width:19rem;max-height:14rem;object-fit:cover;border-radius:0.6rem;border:1px solid var(--border)"></div>` : ''}
        <div class="field">

                ${(n.regions || []).slice(0, 2).map(rg => `<span class="tag region">📍 ${escapeHtml(formatRegion(rg))}</span>`).join('')}
                ${n.ethnic ? `<span class="tag ethnic">👥 ${escapeHtml(n.ethnic)}</span>` : ''}
                ${(n.langPaths || []).slice(0, 1).map(lp => `<span class="tag lang">🗣️ ${escapeHtml(lp)}</span>`).join('')}
              </summary>
              <div class="entry-body">
                ${(n.names || []).length ? `<div class="entry-line"><span class="lbl">俗名</span><span>${n.names.map(nm => `<span class="name-big" style="margin-right:0.6rem;cursor:pointer" onclick="showNameRecords('${esc(nm.text)}')">${escapeHtml(nm.text)}${nm.ipa ? ` <span class="ipa">${escapeHtml(nm.ipa)}</span>` : ''}</span>`).join('')}</span></div>` : ''}
                ${(n.regions || []).length ? `<div class="entry-line"><span class="lbl">地区</span><span>${n.regions.map(rg => `<span class="tag region" style="cursor:pointer;margin-right:0.3rem" onclick="jumpToRegion('${esc(rg.province || '')}')">📍 ${escapeHtml(formatRegion(rg))}</span>`).join('')}</span></div>` : ''}
                ${n.ethnic ? `<div class="entry-line"><span class="lbl">民族</span><span class="tag ethnic" style="cursor:pointer" onclick="switchIndex('ethnic','${esc(n.ethnic)}')">👥 ${escapeHtml(n.ethnic)}</span></div>` : ''}
                ${(n.langPaths || []).length ? `<div class="entry-line"><span class="lbl">语言</span><span>${n.langPaths.map(lp => `<span class="tag lang" style="cursor:pointer;margin-right:0.3rem" onclick="jumpToLang('${esc(lp)}')">🗣️ ${escapeHtml(lp)}</span>`).join('')}</span></div>` : ''}
                ${(n.usages || []).map(u => `
                  <div class="usage-block">
                    <div class="usage-parts">${(u.parts || []).map(p => `<span class="tag">${escapeHtml(p)}</span>`).join(' ') || '—'}</div>
                    <div class="usage-ways">${(u.ways || []).map((w, wi) => `
                      <div class="usage-way-item">
                        <div class="way-line">
                          <span class="way-tag">${escapeHtml(w.tag)}</span>
                          ${w.dish ? `<span class="way-dish">${escapeHtml(w.dish)}</span>` : ''}
                        </div>
                        ${w.method ? `<div class="way-method">${escapeHtml(w.method)}</div>` : ''}
                        ${(w.photos || []).length ? `<div class="photos" style="margin-top:0.35rem">${w.photos.map((p, pi) => `
                          <div class="photo-with-caption">
                            <img src="${p}" onclick="openLightbox('${p.replace(/'/g, "\\'")}', '${((w.photoNames && w.photoNames[pi]) || '').replace(/'/g, "\\'")}')">
                            ${(w.photoNames && w.photoNames[pi]) ? `<div class="photo-caption">${escapeHtml(w.photoNames[pi])}</div>` : ''}
                          </div>`).join('')}</div>` : ''}
                      </div>`).join('')}</div>
                  </div>`).join('')}
              </div>
            </details>`;
          }).join('') : '<div class="value muted">—</div>'}
        </div>
        ${node.notes ? `<div class="field"><label>备注</label><div class="value">${escapeHtml(node.notes)}</div></div>` : ''}
        ${node.refs ? `<div class="field"><label>参考文献</label><div class="value">${escapeHtml(node.refs)}</div></div>` : ''}
        ${editMode ? `<div class="detail-actions"><button onclick="openEditSpeciesModal('${node.id}')">编辑</button><button class="danger" onclick="deleteNode('${node.id}')">删除</button></div>` : ''}
      </div>
    </div>
  `;
}

function openLightbox(src, caption) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:2.35rem';
  el.innerHTML = `
    <img src="${src}" style="max-width:90%;max-height:80vh;object-fit:contain">
    ${caption ? `<div style="color:#fff;font-size:0.9rem;margin-top:0.95rem;text-align:center;max-width:80%">${escapeHtml(caption)}</div>` : ''}
  `;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

function setViewMode(m) { viewMode = m; renderMain(); }

function backToList() { viewMode = 'card'; renderMain(); }

function selectNode(id) {
  // 如果当前是语言树，但目标节点是物种（在分类学树里），自动切到分类学树
  if (currentTreeType === 'lang') {
    const isSpeciesInTaxon = nodes.some(n => n.id === id && n.type === 'species');
    if (isSpeciesInTaxon) {
      currentTreeType = 'taxon';
      document.querySelectorAll('.tree-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.tree === 'taxon');
      });
      updateSearchPlaceholder();
      document.getElementById('searchInput').value = '';
      treeSearchQuery = '';
    }
  }
  currentSelection = id;
  currentView = 'content';
  if (currentTreeType === 'taxon') expandedNodes = new Set();
  else expandedLangNodes = new Set();
  expandAncestors(id, currentTreeType);
  renderTree();
  renderMain();
  scrollTreeToSelected();
}

function buildPath(id) {
  const parts = [];
  let cur = getNode(id);
  while (cur) { parts.unshift(cur.cn || cur.chinese || ''); cur = cur.parentId ? getNode(cur.parentId) : null; }
  return parts.join(' / ');
}

function buildLangPath(id) {
  const parts = [];
  let cur = getLangNode(id);
  while (cur && cur.id !== 'lang_root') { parts.unshift(cur.cn || ''); cur = cur.parentId ? getLangNode(cur.parentId) : null; }
  return parts.join(' > ');
}

function formatRegion(r) {
  return [r.province, r.city, r.county, r.town, r.desc].filter(Boolean).join(' · ');
}

function normalizeRecord(rec) {
  if (!rec.regions) {
    rec.regions = rec.region ? [{ ...rec.region }] : [];
    delete rec.region;
  }
  if (!rec.langPaths) {
    rec.langPaths = rec.langPath ? [rec.langPath] : [];
    delete rec.langPath;
  }
  if (!rec.names) {
    rec.names = rec.name ? [{ text: rec.name, ipa: rec.ipa || '' }] : [];
    delete rec.name;
    delete rec.ipa;
  }
  (rec.usages || []).forEach(u => {
    (u.ways || []).forEach(w => {
      if (w.method === undefined) w.method = '';
      if (!w.photos) w.photos = [];
      if (!w.photoNames) w.photoNames = w.photos.map(() => '');
      while (w.photoNames.length < w.photos.length) w.photoNames.push('');
    });
  });
  if (!rec.usages) rec.usages = [];
  return rec;
}

/* ============================================================
   图片压缩：上传时把大图压到 1-2MB 之间
   ============================================================ */
const MAX_UPLOAD_BYTES = 30 * 1024 * 1024;
const TARGET_MAX_BYTES = 2 * 1024 * 1024;
const TARGET_MIN_BYTES = 1 * 1024 * 1024;

async function compressImage(file) {
  if (file.size > MAX_UPLOAD_BYTES) {
    throw new Error(`图片「${file.name}」超过 30MB，无法上传`);
  }
  if (file.size <= TARGET_MAX_BYTES) {
    return await fileToDataURL(file);
  }
  const dataUrl = await fileToDataURL(file);
  const img = await loadImage(dataUrl);
  let quality = 0.9;
  let result = dataUrl;
  let blob = await dataURLToBlob(dataUrl);
  while (blob.size > TARGET_MAX_BYTES && quality >= 0.5) {
    result = canvasToDataURL(img, quality);
    blob = await dataURLToBlob(result);
    quality -= 0.1;
  }
  let scale = 1.0;
  while (blob.size > TARGET_MAX_BYTES && scale > 0.3) {
    scale -= 0.1;
    result = canvasToDataURL(img, 0.85, scale);
    blob = await dataURLToBlob(result);
  }
  if (blob.size < TARGET_MIN_BYTES) {
    let q = 0.9;
    while (blob.size < TARGET_MIN_BYTES && q <= 0.95) {
      const test = canvasToDataURL(img, q);
      const testBlob = await dataURLToBlob(test);
      if (testBlob.size >= TARGET_MIN_BYTES) {
        result = test; blob = testBlob; break;
      }
      q += 0.05;
    }
  }
  return result;
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}
function dataURLToBlob(dataUrl) {
  return new Promise((res) => {
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    res(new Blob([u8], { type: mime }));
  });
}
function canvasToDataURL(img, quality, scale) {
  scale = scale || 1.0;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}
function fileToDataURL(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

/* ============================================================
   分类阶元 / 语言节点的图片管理
   ============================================================ */
function renderNodePhotoGrid(nodeId, treeType) {
  const el = document.getElementById('nodePhotoGrid_' + nodeId);
  if (!el) return;
  const list = treeType === 'lang' ? langNodes : nodes;
  const node = list.find(n => n.id === nodeId);
  if (!node) return;
  if (!node.photos) node.photos = [];
  if (!node.photoNames) node.photoNames = node.photos.map(() => '');
  while (node.photoNames.length < node.photos.length) node.photoNames.push('');
  if (!node.photos.length) {
    el.innerHTML = '<div class="photos-empty" style="grid-column:1/-1">暂无图片</div>';
    return;
  }
  el.innerHTML = node.photos.map((p, pi) => `
    <div class="photo-edit-item ${pi === 0 ? 'is-cover' : ''}" data-idx="${pi}" draggable="true">
      <span class="photo-num">${pi === 0 ? '封面' : pi+1}</span>
      ${editMode ? `<button class="photo-remove" onclick="removeNodePhoto(event, '${nodeId}', '${treeType}', ${pi})">×</button>` : ''}
      <img src="${p}">
      <input class="photo-name-input" placeholder="图片注释" value="${escapeHtml(node.photoNames[pi] || '')}" oninput="updateNodePhotoName('${nodeId}', '${treeType}', ${pi}, this.value)" onclick="event.stopPropagation()">
    </div>
  `).join('');
  if (!editMode) return;
  const items = el.querySelectorAll('.photo-edit-item');
  let dragIdx = null;
  items.forEach(item => {
    item.addEventListener('dragstart', e => { dragIdx = +item.dataset.idx; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); items.forEach(i => i.classList.remove('drag-over')); });
    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', async e => {
      e.preventDefault();
      const targetIdx = +item.dataset.idx;
      if (dragIdx === null || dragIdx === targetIdx) return;
      const [movedPhoto] = node.photos.splice(dragIdx, 1);
      const [movedName] = node.photoNames.splice(dragIdx, 1);
      node.photos.splice(targetIdx, 0, movedPhoto);
      node.photoNames.splice(targetIdx, 0, movedName);
      await dbPut(treeType === 'lang' ? 'langNodes' : 'nodes', node);
      renderNodePhotoGrid(nodeId, treeType);
      renderTree();
    });
  });
}

function updateNodePhotoName(nodeId, treeType, pi, v) {
  const list = treeType === 'lang' ? langNodes : nodes;
  const node = list.find(n => n.id === nodeId);
  if (!node) return;
  if (!node.photoNames) node.photoNames = [];
  node.photoNames[pi] = v;
}

async function onNodePhotoUpload(e, nodeId, treeType) {
  const files = Array.from(e.target.files || []);
  const list = treeType === 'lang' ? langNodes : nodes;
  const node = list.find(n => n.id === nodeId);
  if (!node) return;
  if (!node.photos) node.photos = [];
  if (!node.photoNames) node.photoNames = [];
  try {
    for (const f of files) {
      const dataUrl = await compressImage(f);
      node.photos.push(dataUrl);
      node.photoNames.push('');
    }
    await dbPut(treeType === 'lang' ? 'langNodes' : 'nodes', node);
    renderNodePhotoGrid(nodeId, treeType);
    renderTree();
  } catch (err) {
    toast(err.message, true);
  }
  e.target.value = '';
}

async function removeNodePhoto(e, nodeId, treeType, pi) {
  e.stopPropagation();
  const list = treeType === 'lang' ? langNodes : nodes;
  const node = list.find(n => n.id === nodeId);
  if (!node) return;
  node.photos.splice(pi, 1);
  if (node.photoNames) node.photoNames.splice(pi, 1);
  await dbPut(treeType === 'lang' ? 'langNodes' : 'nodes', node);
  renderNodePhotoGrid(nodeId, treeType);
  renderTree();
}

/* ============================================================
   索引
   ============================================================ */
function switchIndex(name, initialSearch) {
  currentView = 'index:' + name;
  currentIndexName = name;
  indexSearchQuery = initialSearch || '';
  document.querySelectorAll('.index-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.index === name);
  });
  currentSelection = null;
  renderMain();
  renderIndexPage();
}

function collectAllRecords() {
  const result = [];
  nodes.forEach(n => { if (n.type === 'species') (n.records || []).forEach(rec => result.push({ node: n, rec: normalizeRecord(rec) })); });
  return result;
}

function indexSearchBar(placeholder) {
  return `<div class="index-search"><input placeholder="${placeholder}（回车搜索）" value="${escapeHtml(indexSearchQuery)}" oninput="onIndexSearchInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();onIndexSearchEnter();}"></div>`;
}

function onIndexSearch(v) { indexSearchQuery = v; renderIndexPage(); }

function matchIndex(s) {
  if (!indexSearchQuery) return true;
  return String(s || '').toLowerCase().includes(indexSearchQuery.toLowerCase());
}

function renderIndexPage() {
  const el = document.getElementById('mainContent');
  const emptyState = document.getElementById('emptyState');
  emptyState.style.display = 'none';
  el.style.display = 'block';
  if (!currentView.startsWith('index:')) return;
  const name = currentView.slice(6);
  const all = collectAllRecords();

  if (name === 'chinese') {
    const map = new Map();
    nodes.filter(n => n.type === 'species' && n.chinese).forEach(n => { if (!map.has(n.chinese)) map.set(n.chinese, []); map.get(n.chinese).push(n); });
    const entries = Array.from(map.entries()).map(([nm, list]) => ({ key: nm, list }));
    const filtered = entries.filter(e => matchIndex(e.key));
    renderLetterGroups(el, '📖 中文名索引', filtered, e => ({
      letter: getPinyinInitial(e.key),
      sortKey: getPinyinForSort(e.key),
      html: `<div class="dict-item" onclick="selectNode('${e.list[0].id}')"><span class="name">${escapeHtml(e.key)}</span>${e.list[0].latin ? `<span class="latin">${escapeHtml(e.list[0].latin)}</span>` : ''}</div>`
    }), '搜索中文名…');
    return;
  }
  if (name === 'latin') {
    const list = nodes.filter(n => n.type === 'species' && n.latin && matchIndex(n.latin));
    const entries = list.map(n => ({ key: n.latin, list: [n] }));
    renderLetterGroups(el, '🔤 学名索引', entries, e => ({
      letter: getLatinInitial(e.key),
      sortKey: e.key.toLowerCase(),
      html: `<div class="sci-item" onclick="selectNode('${e.list[0].id}')"><span class="latin">${escapeHtml(e.key)}</span>${e.list[0].author ? `<span style="font-style:normal;font-size:0.75rem;color:var(--muted)">${escapeHtml(e.list[0].author)}</span>` : ''}<span class="cn">${escapeHtml(e.list[0].chinese || '')}</span></div>`
    }), '搜索学名…');
    return;
  }
  if (name === 'common') {
    const map = new Map();
    all.forEach(({node, rec}) => {
      const norm = normalizeRecord(rec);
      (norm.names || []).forEach(nm => {
        const t = nm.text;
        if (!t) return;
        if (!map.has(t)) map.set(t, []);
        map.get(t).push({ node, rec: norm });
      });
    });
    const entries = Array.from(map.entries()).map(([nm, list]) => ({ key: nm, list }));
    const filtered = entries.filter(e => matchIndex(e.key));
    renderLetterGroups(el, '🏷️ 俗名索引', filtered, e => ({
      letter: getPinyinInitial(e.key),
      sortKey: getPinyinForSort(e.key),
      html: `<div class="dict-item" onclick="showNameRecords('${esc(e.key)}')"><span class="name">${escapeHtml(e.key)}</span><span class="count">${e.list.length} 条</span></div>`
    }), '搜索俗名…');
    return;
  }
  if (name === 'part') {
    const map = new Map();
    all.forEach(({rec}) => (rec.usages || []).forEach(u => (u.parts || []).forEach(p => map.set(p, (map.get(p)||0)+1))));
    const filtered = Array.from(map.entries()).filter(([k]) => matchIndex(k)).sort((a,b) => getPinyinForSort(a[0]).localeCompare(getPinyinForSort(b[0])));
    el.innerHTML = `<div class="index-page"><h2>🍃 食用部位索引</h2><div class="desc">共 ${filtered.length} 个部位标签。</div>
      ${indexSearchBar('搜索部位…')}
      <div class="tag-cloud">${filtered.map(([k,v]) => `<div class="tag-item" onclick="showPartRecords('${esc(k)}')">${escapeHtml(k)}<span class="count">${v}</span></div>`).join('')}</div>
    </div>`;
    return;
  }
  if (name === 'way') {
    const map = new Map();
    all.forEach(({rec}) => (rec.usages || []).forEach(u => (u.ways || []).forEach(w => map.set(w.tag, (map.get(w.tag)||0)+1))));
    const filtered = Array.from(map.entries()).filter(([k]) => matchIndex(k)).sort((a,b) => getPinyinForSort(a[0]).localeCompare(getPinyinForSort(b[0])));
    el.innerHTML = `<div class="index-page"><h2>🍲 食用方式索引</h2><div class="desc">共 ${filtered.length} 个方式标签。</div>
      ${indexSearchBar('搜索方式…')}
      <div class="tag-cloud">${filtered.map(([k,v]) => `<div class="tag-item" onclick="showWayRecords('${esc(k)}')">${escapeHtml(k)}<span class="count">${v}</span></div>`).join('')}</div>
    </div>`;
    return;
  }
  if (name === 'dish') {
    const map = new Map();
    all.forEach(({rec}) => (rec.usages || []).forEach(u => (u.ways || []).forEach(w => { if (w.dish) map.set(w.dish, (map.get(w.dish)||0)+1); })));
    const entries = Array.from(map.entries()).map(([nm, count]) => ({ key: nm, list: count }));
    const filtered = entries.filter(e => matchIndex(e.key));
    renderLetterGroups(el, '🍽️ 菜品名索引', filtered, e => ({
      letter: getPinyinInitial(e.key),
      sortKey: getPinyinForSort(e.key),
      html: `<div class="dict-item" onclick="showDishRecords('${esc(e.key)}')"><span class="name">${escapeHtml(e.key)}</span><span class="count">${e.list} 条</span></div>`
    }), '搜索菜品名…');
    return;
  }
  if (name === 'region') {
    const provinces = {};
    all.forEach(({rec}) => {
      const norm = normalizeRecord(rec);
      (norm.regions || []).forEach(r => {
        if (!r.province) return;
        if (!provinces[r.province]) provinces[r.province] = { count: 0 };
        provinces[r.province].count++;
      });
    });
    const entries = Object.entries(provinces).map(([nm, v]) => ({ key: nm, list: v.count }));
    const filtered = entries.filter(e => matchIndex(e.key));
    renderLetterGroups(el, '📍 地区索引', filtered, e => ({
      letter: getPinyinInitial(e.key),
      sortKey: getPinyinForSort(e.key),
      html: `<div class="dict-item" onclick="showProvinceRecords('${esc(e.key)}')"><span class="name">${escapeHtml(e.key)}</span><span class="count">${e.list} 条</span></div>`
    }), '搜索省份…');
    return;
  }
  if (name === 'ethnic') {
    const map = new Map();
    all.forEach(({rec}) => { if (rec.ethnic) map.set(rec.ethnic, (map.get(rec.ethnic)||0)+1); });
    const entries = Array.from(map.entries()).map(([nm, count]) => ({ key: nm, list: count }));
    const filtered = entries.filter(e => matchIndex(e.key));
    renderLetterGroups(el, '👥 民族索引', filtered, e => ({
      letter: getPinyinInitial(e.key),
      sortKey: getPinyinForSort(e.key),
      html: `<div class="dict-item" onclick="showEthnicRecords('${esc(e.key)}')"><span class="name">${escapeHtml(e.key)}</span><span class="count">${e.list} 条</span></div>`
    }), '搜索民族…');
    return;
  }
}

function backToIndex(name) { currentIndexName = name; switchIndex(name); }

function showNameRecords(name) {
  const all = [];
  nodes.forEach(n => {
    if (n.type !== 'species') return;
    (n.records || []).forEach(rec => {
      const norm = normalizeRecord({ ...rec });
      (norm.names || []).forEach(nm => {
        if (nm.text === name) all.push({ node: n, rec: norm });
      });
    });
  });
  const el = document.getElementById('mainContent');
  el.innerHTML = `<div class="index-page"><div style="cursor:pointer;color:var(--muted);margin-bottom:0.7rem" onclick="backToIndex('common')">← 返回俗名索引</div><h2>🏷️ ${escapeHtml(name)}</h2><div class="desc">关联 ${all.length} 条记录</div>

    <div class="form-row"><label>阶元</label><select id="editRankName">${allRanks.map(r => `<option value="${escapeHtml(r)}" ${r === node.rankName ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}</select></div>

    <div class="form-row"><label>拉丁名</label><input id="editRankLatin" value="${escapeHtml(node.latin || '')}"></div>
    <div class="form-actions">
      <button onclick="closeModal()">取消</button>
      <button class="danger" onclick="deleteRankNode()">删除此节点</button>
      <button class="primary" onclick="saveEditRankNode()">保存</button>
    </div>
  `, 'sm');
}
async function saveEditRankNode() {
  const id = modalContext.editRankNodeId;
  const node = getNode(id);
  if (!node) return;
  node.rankName = document.getElementById('editRankName').value;
  node.cn = document.getElementById('editRankCn').value.trim();

async function saveEditLangNode() {
  const id = modalContext.editLangNodeId;
  const node = getLangNode(id);
  if (!node) return;
  const oldCn = node.cn;
  const newCn = document.getElementById('editLangCn').value.trim();
  const newRank = document.getElementById('editLangRank').value;
  const newLatin = document.getElementById('editLangLatin').value.trim();
  if (!newCn) { toast('请填写中文名'); return; }

  node.rankName = newRank;
  node.cn = newCn;
  node.latin = newLatin;
  await dbPut('langNodes', node);

  let changed = 0;
  if (oldCn !== newCn) {
    for (const sp of nodes) {
      if (sp.type !== 'species') continue;
      let nodeChanged = false;
      (sp.records || []).forEach(rec => {
        const lps = rec.langPaths || (rec.langPath ? [rec.langPath] : []);
        if (!lps.length) return;
        let localChanged = false;
        const newPaths = lps.map(lp => {
          const parts = lp.split(' > ');
          if (parts.includes(oldCn)) {
            localChanged = true;
            return parts.map(p => p === oldCn ? newCn : p).join(' > ');
          }
          return lp;
        });
        if (localChanged) {
          rec.langPaths = newPaths;
          delete rec.langPath;
          nodeChanged = true;
        }
      });
      if (nodeChanged) {
        await dbPut('nodes', sp);
        changed++;
      }
    }
    nodes = await dbGetAll('nodes');
  }

  langNodes = await dbGetAll('langNodes');
  closeModal();
  renderTree();
  renderMain();
  if (changed > 0) toast(`已更新语言节点，同步了 ${changed} 个词条`);
  else toast('已更新');
}

async function deleteLangNode() {
  const id = modalContext.editLangNodeId;
  const node = getLangNode(id);
  if (!node) return;
  if (!confirm('确定删除此节点及其所有子节点？\n\n所有词条里挂在该语言（或其子语言）下的语言记录会被清空。')) return;

  const deletedNames = new Set();
  function collectNames(nid) {
    const n = getLangNode(nid);
    if (!n) return;
    if (n.cn) deletedNames.add(n.cn);
    (n.children || []).forEach(collectNames);
  }
  collectNames(id);

  if (node.parentId) {
    const p = getLangNode(node.parentId);
    if (p) { p.children = (p.children || []).filter(c => c !== id); await dbPut('langNodes', p); }
  }
  async function del(nid) {
    const n = getLangNode(nid);
    if (!n) return;
    for (const c of (n.children || [])) await del(c);
    await dbDelete('langNodes', nid);
  }
  await del(id);
  langNodes = await dbGetAll('langNodes');

  let changed = 0;
  for (const sp of nodes) {
    if (sp.type !== 'species') continue;
    let nodeChanged = false;
    (sp.records || []).forEach(rec => {
      const lps = rec.langPaths || (rec.langPath ? [rec.langPath] : []);
      if (!lps.length) return;
      const newPaths = [];
      let localChanged = false;
      lps.forEach(lp => {
        const parts = lp.split(' > ');
        const filtered = parts.filter(p => !deletedNames.has(p));
        const newPath = filtered.join(' > ');
        if (newPath !== lp) localChanged = true;
        if (newPath) newPaths.push(newPath);
      });
      if (localChanged) {
        rec.langPaths = newPaths;
        delete rec.langPath;
        nodeChanged = true;
      }
    });
    if (nodeChanged) {
      await dbPut('nodes', sp);
      changed++;
    }
  }
  nodes = await dbGetAll('nodes');

  closeModal();
  currentSelection = null;
  renderTree();
  renderMain();
  if (changed > 0) toast(`已删除语言节点，清空了 ${changed} 个词条的语言信息`);
  else toast('已删除');
}

function filterRankCn(q) {
  const dropdown = document.getElementById('rankCnDropdown');
  if (!dropdown) return;
  const rank = selectedRankName || (document.getElementById('customRankInput').value.trim() || '');
  if (!rank) { dropdown.style.display = 'none'; return; }
  const treeType = modalContext.treeType;
  let opts = [];
  if (treeType === 'taxon') {
    const seen = new Set();
    nodes.forEach(n => { if (n.rankName === rank && n.cn && !seen.has(n.cn)) { opts.push({ cn: n.cn, latin: n.latin || '' }); seen.add(n.cn); } });
  } else {
    const seen = new Set();
    langNodes.forEach(n => { if (n.rankName === rank && n.cn && !seen.has(n.cn)) { opts.push({ cn: n.cn, latin: '' }); seen.add(n.cn); } });
  }
  const lower = (q || '').toLowerCase();
  const filtered = lower ? opts.filter(o => o.cn.toLowerCase().includes(lower) || (o.latin || '').toLowerCase().includes(lower)) : opts;
  if (!filtered.length) dropdown.innerHTML = '<div style="padding:0.45rem 0.7rem;font-size:0.8rem;color:var(--muted)">无匹配（可手动输入）</div>';
  else dropdown.innerHTML = filtered.slice(0, 80).map((o, i) => `<div class="rank-opt ${i===0?'hl':''}" data-i="${i}" onmousedown="event.preventDefault();pickRankCn(${i})"><span>${escapeHtml(o.cn)}</span>${o.latin ? `<span style="font-family:var(--serif);font-style:italic;font-size:0.75rem;color:var(--muted)">${escapeHtml(o.latin)}</span>` : ''}</div>`).join('');
  dropdown._opts = filtered;
  dropdown.style.display = 'block';
}
function pickRankCn(i) {
  const dropdown = document.getElementById('rankCnDropdown');
  const o = dropdown._opts[i];
  if (!o) return;
  document.getElementById('rankCn').value = o.cn;
  document.getElementById('rankLatin').value = o.latin || '';
  dropdown.style.display = 'none';
}
async function saveRank() {
  const treeType = modalContext.treeType;
  const rankName = selectedRankName || document.getElementById('customRankInput').value.trim();
  const cn = document.getElementById('rankCn').value.trim();
  const latin = document.getElementById('rankLatin').value.trim();
  if (!rankName) { toast('请选择或输入阶元名'); return; }
  if (!cn) { toast('请填写中文名'); return; }
  const list = treeType === 'lang' ? langNodes : nodes;
  const parent = modalContext.parentId ? list.find(n => n.id === modalContext.parentId) : null;
  const rankOrder = treeType === 'lang' ? LANG_RANK_ORDER : RANK_ORDER;
  if (parent && rankOrder[rankName] !== undefined && rankOrder[parent.rankName] !== undefined) {
    if (rankOrder[rankName] <= rankOrder[parent.rankName]) { toast(`不能在「${parent.rankName}」下添加「${rankName}」`, true); return; }
  }
  const newNode = {
    id: (treeType === 'lang' ? 'lang_n_' : 'n_') + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    type: treeType === 'lang' ? 'langRank' : 'rank',
    rankName, cn, latin,
    parentId: parent ? parent.id : null,
    children: [], photos: [], photoNames: []
  };
  await dbPut(treeType === 'lang' ? 'langNodes' : 'nodes', newNode);
  if (parent) {
    if (!parent.children) parent.children = [];
    parent.children.push(newNode.id);
    await dbPut(treeType === 'lang' ? 'langNodes' : 'nodes', parent);
  }
  const customKey = treeType === 'lang' ? 'customLangRanks' : 'customRanks';
  const standardRanks = treeType === 'lang' ? STANDARD_LANG_RANKS : STANDARD_RANKS;
  if (!standardRanks.includes(rankName)) {
    if (!meta[customKey]) meta[customKey] = [];
    if (!meta[customKey].includes(rankName)) { meta[customKey].push(rankName); await dbPut('meta', { key: customKey, value: meta[customKey] }); }
  }
  if (treeType === 'lang') langNodes = await dbGetAll('langNodes'); else nodes = await dbGetAll('nodes');
  closeModal();
  currentSelection = newNode.id;
  expandAncestors(newNode.id, treeType);
  renderTree(); renderMain(); scrollTreeToSelected();
  toast('已添加阶元');
}

function renderTagCombo(elId, getArr, setArr, metaKey, placeholder, tagClass) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = '';
  const input = document.createElement('input');
  input.placeholder = placeholder || '输入后回车添加…';
  const dropdown = document.createElement('div');
  dropdown.className = 'tag-dropdown';
  el.appendChild(input);
  el.appendChild(dropdown);

  function renderPicked() {
    el.querySelectorAll('.picked').forEach(n => n.remove());
    const arr = getArr();
    arr.forEach((l, idx) => {
      const c = document.createElement('span');
      c.className = 'picked ' + (tagClass || '');
      c.innerHTML = `${escapeHtml(l)} <span class="x">×</span>`;
      c.querySelector('.x').onclick = e => { e.stopPropagation(); const a = getArr(); a.splice(idx, 1); setArr(a); renderPicked(); };
      el.insertBefore(c, input);
    });
  }
  function renderDropdown() {
    const q = input.value.trim().toLowerCase();
    const lib = meta[metaKey] || [];
    const filtered = q ? lib.filter(o => o.toLowerCase().includes(q)) : lib;
    if (!filtered.length) dropdown.innerHTML = '<div class="empty">无匹配，回车保存新 tag</div>';
    else dropdown.innerHTML = filtered.slice(0, 50).map((o, i) => `<div class="opt ${i===0?'hl':''}" data-i="${i}">${escapeHtml(o)}</div>`).join('');
    dropdown.classList.add('open');
    const first = dropdown.querySelector('.opt');
    if (first) first.scrollIntoView({ block: 'nearest' });
    dropdown.querySelectorAll('.opt').forEach(n => {
      n.addEventListener('mousedown', e => { e.preventDefault(); addTag(filtered[+n.dataset.i]); });
    });
  }
   function addTag(v) {
     if (!v) return;
     const arr = getArr();
     // 当前记录里已经有这个 tag → 提示
     if (arr.includes(v)) {
      toast('这条记录里已经有「' + v + '」了', true);
       input.value = '';
       dropdown.classList.remove('open');
       return;
    }
    arr.push(v); setArr(arr);
    // 选项库里已有这个 tag → 静默去重；没有 → 加入选项库
    saveMetaLib(metaKey, v);
    input.value = ''; renderPicked(); dropdown.classList.remove('open');
  }
  input.addEventListener('input', renderDropdown);
  input.addEventListener('focus', renderDropdown);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const q = input.value.trim(); if (!q) return;
      const lib = meta[metaKey] || [];
      const first = lib.find(o => o.toLowerCase().includes(q.toLowerCase()));
      addTag(first || q);
    } else if (e.key === 'Backspace' && !input.value) {
      const arr = getArr(); if (arr.length) { arr.pop(); setArr(arr); renderPicked(); }
    } else if (e.key === 'Escape') dropdown.classList.remove('open');
  });
  renderPicked();
}

function renderEthnicPicker(recIdx) {
  const rec = currentSpeciesForm.records[recIdx];

  if (!w.photos) w.photos = [];

  if (!w.photos.length) { el.innerHTML = '<div class="photos-empty" style="grid-column:1/-1">暂无图片</div>'; return; }
  el.innerHTML = w.photos.map((p, pi) => {

    return `<div class="photo-edit-item ${isCover?'is-cover':''}" data-idx="${pi}" draggable="true">
      <span class="photo-num">${pi+1}</span>

    </div>`;
  }).join('');
  const items = el.querySelectorAll('.photo-edit-item');
  let dragIdx = null;
  items.forEach(item => {
    item.addEventListener('dragstart', e => { dragIdx = +item.dataset.idx; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); items.forEach(i => i.classList.remove('drag-over')); });
    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      const targetIdx = +item.dataset.idx;
      if (dragIdx === null || dragIdx === targetIdx) return;
      const [movedPhoto] = w.photos.splice(dragIdx, 1);
      const [movedName] = w.photoNames.splice(dragIdx, 1);
      w.photos.splice(targetIdx, 0, movedPhoto);
      w.photoNames.splice(targetIdx, 0, movedName);
      renderWayPhotosGrid(recIdx, ui, wi);
    });
  });
}

function filterRegionCombo(recIdx, regionIdx, level) {
  const wrap = document.getElementById(`rc_${level}_${recIdx}_${regionIdx}`);
  if (!wrap) return;
  const input = wrap.querySelector('input');
  const dropdown = wrap.querySelector('.dropdown-list');
  const q = input.value.trim().toLowerCase();
  const rec = currentSpeciesForm.records[recIdx];
  if (!rec.regions) rec.regions = [];
  if (!rec.regions[regionIdx]) rec.regions[regionIdx] = { province:'', city:'', county:'', town:'', desc:'' };
  const entry = rec.regions[regionIdx];
  if (!REGION_DATA) {
    dropdown.innerHTML = '<div class="empty">正在加载省市区数据…</div>';
    dropdown.classList.add('open');
    loadRegionData().then(() => filterRegionCombo(recIdx, regionIdx, level));
    return;
  }
  let opts = [];
  if (level === 'province') opts = Object.keys(REGION_DATA);
  else if (level === 'city') {
    const p = entry.province;
    if (p && REGION_DATA[p]) opts = Object.keys(REGION_DATA[p]);
  } else if (level === 'county') {
    const p = entry.province, c = entry.city;
    if (p && c && REGION_DATA[p] && REGION_DATA[p][c]) opts = Object.keys(REGION_DATA[p][c]);
  }
  const filtered = q ? opts.filter(o => o.toLowerCase().includes(q)) : opts;
  if (!filtered.length) { dropdown.classList.remove('open'); return; }
  // 高亮第一个匹配项
  dropdown.innerHTML = filtered.slice(0, 100).map((o, i) =>
    `<div class="opt ${i === 0 ? 'hl' : ''}" data-i="${i}">${escapeHtml(o)}</div>`
  ).join('');
  dropdown.classList.add('open');
  // 滚动到第一个匹配项
  const first = dropdown.querySelector('.opt');
  if (first) first.scrollIntoView({ block: 'nearest' });
  dropdown.querySelectorAll('.opt').forEach(n => {
    n.addEventListener('mousedown', e => {
      e.preventDefault();
      const v = filtered[+n.dataset.i];
      input.value = v;
      entry[level] = v;
      if (level === 'province') { entry.city = ''; entry.county = ''; }
      else if (level === 'city') { entry.county = ''; }
      renderRecordEntries();
    });
  });
}

function renderLangPickerTree() {
  const container = document.getElementById('langPickerTree');
  if (!container) return;
  container.innerHTML = '';
  function renderNodeTo(node, container) {
    const children = sortTreeChildren((node.children || []).map(cid => getLangNode(cid)).filter(Boolean));
    const div = document.createElement('div');
    div.className = 'lang-node';
    const recIdx = modalContext.langPickerFor;
    const langIdx = modalContext.langIdx;
    const curPath = (currentSpeciesForm.records[recIdx] && currentSpeciesForm.records[recIdx].langPaths && currentSpeciesForm.records[recIdx].langPaths[langIdx]) || '';
    const isSelected = curPath === buildLangPath(node.id);
    div.innerHTML = `<div class="lang-label ${isSelected ? 'selected' : ''}">${escapeHtml(node.cn)} ${node.rankName ? `<span style="font-size:0.7rem;color:var(--muted);font-style:italic">${escapeHtml(node.rankName)}</span>` : ''}</div>`;
    div.querySelector('.lang-label').onclick = () => pickLangPath(node.id);
    container.appendChild(div);
    if (children.length) {
      const childDiv = document.createElement('div');
      childDiv.className = 'lang-children';
      container.appendChild(childDiv);
      children.forEach(c => renderNodeTo(c, childDiv));
    }
  }
  const root = getLangNode('lang_root');
  const rootChildren = sortTreeChildren((root.children || []).map(cid => getLangNode(cid)).filter(Boolean));
  rootChildren.forEach(c => renderNodeTo(c, container));
}

async function saveSpecies() {
  const chinese = document.getElementById('sp_chinese').value.trim();
  const latin = document.getElementById('sp_latin').value.trim();
  const author = document.getElementById('sp_author').value.trim();
  if (!chinese && !latin) { toast('请至少填写中文名或学名'); return; }
  const records = currentSpeciesForm.records.map(r => ({
    regions: (r.regions || []).map(rg => ({
      province: (rg.province || '').trim(),
      city: (rg.city || '').trim(),
      county: (rg.county || '').trim(),
      town: (rg.town || '').trim(),
      desc: (rg.desc || '').trim()
    })).filter(rg => rg.province || rg.city || rg.county || rg.town || rg.desc),
    ethnic: (r.ethnic || '').trim(),
    langPaths: (r.langPaths || []).filter(Boolean),
    names: (r.names || []).filter(n => (n.text || '').trim() || (n.ipa || '').trim()).map(n => ({ text: (n.text || '').trim(), ipa: (n.ipa || '').trim() })),
    usages: (r.usages || []).map(u => ({
      parts: (u.parts || []).filter(Boolean),
      ways: (u.ways || []).filter(w => w.tag || w.dish || w.method || (w.photos && w.photos.length)).map(w => ({
        tag: (w.tag || '').trim(), dish: (w.dish || '').trim(), method: (w.method || '').trim(),
        photos: (w.photos || []).slice(),
        photoNames: (w.photoNames || []).slice()
      }))
    })).filter(u => u.parts.length || u.ways.length)
  })).filter(r => r.names.length || r.usages.length || r.langPaths.length || r.ethnic || r.regions.length);

  const notes = document.getElementById('sp_notes').value.trim();
  const refs = document.getElementById('sp_refs').value.trim();
  for (const r of records) {
    if (r.ethnic) await saveMetaLib('ethnicLib', r.ethnic);
    for (const u of r.usages) {
      for (const p of u.parts) await saveMetaLib('partsLib', p);
      for (const w of u.ways) { if (w.tag) await saveMetaLib('waysLib', w.tag); if (w.dish) await saveMetaLib('dishesLib', w.dish); }
    }
  }
  const isNew = !currentSpeciesForm.id;
  const id = currentSpeciesForm.id || 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const speciesNode = {
    id, type: 'species', parentId: currentSpeciesForm.parentId,
    chinese, latin, author, records, notes, refs,
    coverPhoto: currentSpeciesForm.coverPhoto || '',
    children: isNew ? [] : (getNode(id)?.children || []),
    photos: isNew ? [] : (getNode(id)?.photos || [])
  };
  await dbPut('nodes', speciesNode);
  if (isNew && currentSpeciesForm.parentId) {
    const parent = getNode(currentSpeciesForm.parentId);
    if (parent) {
      if (!parent.children) parent.children = [];
      parent.children.push(id);
      await dbPut('nodes', parent);
    }
  }
  nodes = await dbGetAll('nodes');
  closeModal();
  currentSelection = id;
  expandedNodes = new Set();
  expandAncestors(id, 'taxon');
  renderTree(); renderMain(); scrollTreeToSelected();
  toast(isNew ? '已添加物种' : '已更新');
}
